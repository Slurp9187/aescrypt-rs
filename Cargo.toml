# ============================================================================
# FILE: Cargo.toml
# ============================================================================

[package]
name = "aescrypt-rs"
version = "0.2.0-rc.11"
edition = "2021"
rust-version = "1.85"
description = "AES Crypt (v0-v3) Rust encryption/decryption library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slurp9187/aescrypt-rs"
documentation = "https://docs.rs/aescrypt-rs"
keywords = ["aes", "crypt", "encryption", "decryption"]
categories = ["cryptography"]
include = ["benches/**/*.rs", "src/**/*.rs", "/CHANGELOG.md", "/LICENSE*", "/README.md"]

# ----------------------------------------------------------------------
# docs.rs metadata
# ----------------------------------------------------------------------
[package.metadata.docs.rs]
all-features = true

# ----------------------------------------------------------------------
# Runtime dependencies
# ----------------------------------------------------------------------
[dependencies]
aes = { version = "0.8", features = ["zeroize"] }
hmac = "0.12"
pbkdf2 = "0.12"
# `secure-gate` FLOATS on its git `main` while its API is still settling; the two
# crates are coordinating API fixes, and those land on `main` before they reach an
# RC. Cargo.lock still freezes an exact commit, so builds stay reproducible —
# "floating" only means `cargo update -p secure-gate` is allowed to move it. Run
# that in `fuzz/Cargo.lock` too; never a bare `cargo update`.
#
# `version` must stay beside `git`: this crate is published, and `cargo publish`
# rejects a dependency with no registry requirement. It must stay a CARET, not `=`
# — `main` bumps past the published RC while unpublished, and an `=` pin would
# break on the first bump. Hold it at the last PUBLISHED RC, never at whatever
# `main`'s manifest says: that is what makes `cargo publish --dry-run` answer
# "could this publish today?" rather than failing forever on version skew.
#
# NOTE: `secure-gate = "0.9"` resolves to NOTHING — a caret matches a pre-release
# only when the requirement itself carries one for the same major.minor.patch.
#
# Revert to a plain registry dep, pinned with `=`, before publishing. See
# CHANGELOG.md [Unreleased].
secure-gate = { git = "https://github.com/Slurp9187/secure-gate", version = "0.9.0-rc.10", features = ["rand", "ct-eq"] }
sha2 = "0.10"
thiserror = "2.0"

# ----------------------------------------------------------------------
# Dev / test / bench dependencies
# ----------------------------------------------------------------------
[dev-dependencies]
# criterion 0.8+ declares rustc 1.86, above this crate's 1.85 floor. 0.7 resolves
# clap 4.6 (edition 2024, rust-version 1.85) — satisfied with ZERO margin, which is
# why `cargo bench --no-run` belongs in CI: it is the only guard on that knife-edge.
criterion = { version = "0.7", features = ["html_reports"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ----------------------------------------------------------------------
# Benchmark targets
# ----------------------------------------------------------------------
[[bench]]
name = "kdf"
harness = false

[[bench]]
name = "encrypt"
harness = false

[[bench]]
name = "decrypt"
harness = false

[[bench]]
name = "roundtrip"
harness = false

[[bench]]
name = "iterations"
harness = false

