# ============================================================================
# FILE: Cargo.toml
# ============================================================================

[package]
name = "aescrypt-rs"
# `aescrypt-cli` is versioned on its own and pins a published release of this
# crate with `=`; a bump here does not bump it.
version = "0.2.0-rc.18"
edition = "2024"
rust-version = "1.87"
description = "AES Crypt (v0-v3) Rust encryption/decryption library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Slurp9187/aescrypt-rs"
documentation = "https://docs.rs/aescrypt-rs"
keywords = ["aes", "crypt", "encryption", "decryption"]
categories = ["cryptography"]
# Allowlist, not `exclude`, deliberately: with an allowlist a new directory is
# absent from the tarball until it is named here, and the worst case is a verify
# build that fails loudly. With `exclude` a new directory ships by default and
# the worst case is publishing something unintended to an immutable registry —
# crates.io has no delete, and a yanked version stays downloadable. `fuzz/` is
# 135 MB, so that is not hypothetical.
#
# `tests/` and its vectors ship so the crate's headline claim — round-trip
# verified against all 63 official v0-v3 test vectors — is checkable from the
# published artifact rather than only from a repo that can be force-pushed. It
# also lets distro packagers, who build from the crates.io tarball, actually run
# the suite instead of skipping it. Costs ~65 KiB compressed.
#
# `benches/` ships too, at 2.2 KiB compressed — not because timings are
# reproducible across machines (they are not) but because the seven `[[bench]]`
# targets below must stay declared for `harness = false`, and criterion cannot
# use target auto-discovery. Excluding the sources makes `cargo package` warn
# once per target, forever, and leaves a manifest declaring targets it cannot
# build. Seven recurring warnings is a worse trade than 2.2 KiB. If the benches
# ever grow fixtures, revisit — that is the case where excluding wins.
#
# `fuzz/` (135 MB), `docs/` and `scripts/` stay out.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "tests/test_data/**",
    "benches/**/*.rs",
    "/CHANGELOG.md",
    "/LICENSE*",
    "/README.md",
]

# ----------------------------------------------------------------------
# Workspace
# ----------------------------------------------------------------------
# The root package stays the only default member, so a bare `cargo test` here
# still builds the library alone; CI passes `--workspace`.
#
# `fuzz/` is not a member: it keeps its own lockfile (nightly-only
# libfuzzer-sys). It declares its own empty `[workspace]` table to say so —
# `exclude` here is not enough, because fuzz depends on this package by path.
[workspace]
members = [".", "aescrypt-cli"]

# ----------------------------------------------------------------------
# Lints: documentation is required, not optional
# ----------------------------------------------------------------------
# Every member opts in with `[lints] workspace = true`. `fuzz/` is outside the
# workspace on purpose and is not covered. Tests and benches allow
# `missing_docs_in_private_items` at their crate root; nothing else does.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
missing_errors_doc = "deny"
missing_panics_doc = "deny"
doc_markdown = "deny"
missing_docs_in_private_items = "deny"

[lints]
workspace = true

# ----------------------------------------------------------------------
# docs.rs metadata
# ----------------------------------------------------------------------
[package.metadata.docs.rs]
all-features = true

# ----------------------------------------------------------------------
# Runtime dependencies
# ----------------------------------------------------------------------
[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
hmac = { version = "0.13", features = ["zeroize"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
# Exact pin, registry dep — this crate is publishable in this state.
#
# `=` and not a caret, deliberately: secure-gate is still in RC and breaking
# changes land between them (rc.9 deleted the alias macros, rc.12 reshaped
# `Dynamic::new_with`). A published requirement travels to dependents; a lockfile
# does not. A caret here would let a downstream `cargo build` float onto the next
# RC and break against a version this crate never tested.
#
# Bump deliberately: change the pin, `cargo update -p secure-gate` in BOTH this
# lockfile and `fuzz/Cargo.lock`, then run the full suite. Keep this line
# character-identical to the one in `fuzz/Cargo.toml` — that crate depends on
# secure-gate directly as well as on this one by path, and any divergence puts two
# semver-incompatible copies in one graph (`expected Fixed<[u8; 32]>, found
# Fixed<[u8; 32]>`).
#
# NOTE: `secure-gate = "0.9"` resolves to NOTHING — a caret matches a pre-release
# only when the requirement itself carries one for the same major.minor.patch.
secure-gate = { version = "=0.9.0-rc.17", features = ["rand", "ct-eq"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
thiserror = "2.0"

# ----------------------------------------------------------------------
# Dev / test / bench dependencies
# ----------------------------------------------------------------------
[dev-dependencies]
# The 1.87 floor comes from secure-gate (since 0.9.0-rc.16, RUSTSEC-2026-0385); criterion
# 0.8 declares rustc 1.86. `cargo bench --no-run` stays in CI as the only build
# that checks the dev-dependencies against the floor.
criterion = { version = "0.8", features = ["html_reports"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ----------------------------------------------------------------------
# Benchmark targets
# ----------------------------------------------------------------------
[[bench]]
name = "kdf"
harness = false

[[bench]]
name = "encrypt"
harness = false

[[bench]]
name = "decrypt"
harness = false

[[bench]]
name = "roundtrip"
harness = false

[[bench]]
name = "iterations"
harness = false

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "small_files"
harness = false

