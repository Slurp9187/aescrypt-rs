[package]
name = "aescrypt-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
# Declared so the MSRV-aware resolver (`.cargo/config.toml`,
# `incompatible-rust-versions = "fallback"`) has something to rank against here
# too; without it this lockfile resolves unconstrained.
rust-version = "1.87"

[package.metadata]
cargo-fuzz = true

# Its own workspace root, so the parent's `[workspace]` does not claim it. This
# crate keeps its own lockfile and builds on nightly; see ../Cargo.toml.
[workspace]

[features]
# `fuzzing` gates libfuzzer-sys (nightly-only) so the harness library and its
# smoke tests build on the stable / MSRV toolchain:
#   cargo test --no-default-features --manifest-path fuzz/Cargo.toml
default = ["fuzzing"]
fuzzing = ["dep:libfuzzer-sys"]

[dependencies]
aescrypt-rs = { path = ".." }
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = { version = "0.4", optional = true }
# The legacy-file builder mirrors the v0-v2 wire format with the same
# primitive crates (and versions) the parent uses.
#
# This line MUST stay character-identical to the parent's. This crate depends on
# secure-gate directly as well as on `aescrypt-rs` by path, so any divergence puts
# two semver-incompatible copies in one graph — the symptom is the baffling
# `expected Fixed<[u8; 32]>, found Fixed<[u8; 32]>`.
secure-gate = { version = "=0.9.0-rc.17", features = ["rand", "ct-eq"] }
aes = "0.9"
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }

[[bin]]
name = "decrypt_raw"
path = "fuzz_targets/decrypt_raw.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "roundtrip_v3"
path = "fuzz_targets/roundtrip_v3.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "roundtrip_legacy"
path = "fuzz_targets/roundtrip_legacy.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "stream_decrypt"
path = "fuzz_targets/stream_decrypt.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "verified_differential"
path = "fuzz_targets/verified_differential.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]
