name: msrv

# Makes the MSRV claim in Cargo.toml, src/lib.rs and README.md true. Until
# 0.2.0-rc.11 those three all asserted that CI enforced `rust-version` and no
# such job existed.
#
# `secure-gate` is an exact registry pin, so these jobs build the same version a
# downstream consumer would get. Bumping it is a deliberate manifest edit plus
# `cargo update -p secure-gate` in both lockfiles — see Cargo.toml.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

jobs:
  msrv:
    name: rust 1.85 (declared floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85 --profile minimal
      - run: cargo +1.85 test --workspace --all-features
      # `bench --no-run` is not redundant with `test`. criterion 0.7 resolves
      # clap 4.6, which declares rust-version 1.85 — satisfied with ZERO margin.
      # Nothing else in the build touches that edge, so this is the only guard
      # against a dev-dependency drifting past the floor.
      - run: cargo +1.85 bench --no-run

  stable:
    name: rust stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --workspace --all-features

  # The CLI touches the terminal, `sh` vs `cmd`, and rename semantics, all of
  # which differ by OS. Linux is covered by the jobs above.
  cli-os:
    name: aescrypt-cli on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A test stuck on a pty otherwise holds the runner for GitHub's 6-hour
    # default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test -p aescrypt-cli

  # On the pinned toolchain (rust-toolchain.toml), not stable: each stable
  # release adds clippy lints, and a lint job that goes red on its own between
  # pushes gets ignored.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85 --profile minimal --component rustfmt,clippy
      - run: cargo +1.85 fmt --all --check
      - run: cargo +1.85 clippy --workspace --all-targets -- -D warnings
