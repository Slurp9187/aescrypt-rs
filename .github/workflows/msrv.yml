name: msrv

# Makes the MSRV claim in Cargo.toml, src/lib.rs and README.md true. Until
# 0.2.0-rc.11 those three all asserted that CI enforced `rust-version` and no
# such job existed.
#
# `secure-gate` is an exact registry pin, so these jobs build the same version a
# downstream consumer would get. Bumping it is a deliberate manifest edit plus
# `cargo update -p secure-gate` in both lockfiles — see Cargo.toml.

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

jobs:
  msrv:
    name: rust 1.87 (declared floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.87 --profile minimal
      - run: cargo +1.87 test --workspace --all-features
      # `bench --no-run` is not redundant with `test`: it is the only build of
      # criterion and its tree (clap 4.6), so it is the only guard against a
      # dev-dependency drifting past the floor. The floor itself is set by
      # secure-gate, rust-version 1.87 since 0.9.0-rc.16 (RUSTSEC-2026-0385).
      - run: cargo +1.87 bench --no-run

  stable:
    name: rust stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --workspace --all-features

  # The CLI touches the terminal, `sh` vs `cmd`, and rename semantics, all of
  # which differ by OS. Linux is covered by the jobs above.
  cli-os:
    name: aescrypt-cli on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A test stuck on a pty otherwise holds the runner for GitHub's 6-hour
    # default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test -p aescrypt-cli

  # On the pinned toolchain (rust-toolchain.toml), not stable: each stable
  # release adds clippy lints, and a lint job that goes red on its own between
  # pushes gets ignored.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.87 --profile minimal --component rustfmt,clippy
      - run: cargo +1.87 fmt --all --check
      - run: cargo +1.87 clippy --workspace --all-targets -- -D warnings

  # Documentation is required (`[workspace.lints]` in Cargo.toml). Clippy covers
  # missing docs; rustdoc covers what only it sees: broken, private and
  # redundant intra-doc links, bad code blocks, bare URLs. The second run also
  # documents private items, so link rot in internal docs fails too. Doctests,
  # README examples included, run in the test jobs. Pinned for the same reason
  # as the lint job.
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.87 --profile minimal
      - run: cargo +1.87 doc --workspace --no-deps --all-features
      - run: cargo +1.87 doc --workspace --no-deps --all-features --document-private-items
